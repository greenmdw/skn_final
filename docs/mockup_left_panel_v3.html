<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrueFit 좌측 패널 v3 — 대화 내역 / 저장한 견적 분리</title>
<style>
:root{--bg:#071116;--panel:#0d1a23;--panel2:#0c1820;--ink:#050b10;--line:#233744;--line2:#37695f;--text:#f4f7f7;--muted:#92a4b2;--mint:#60edc0;--on-mint:#06241b;--info:#66c8f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif;padding:28px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:18px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px;line-height:1.6;font-size:13px;max-width:900px}
.stage{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font-size:12px;font-weight:700;color:var(--muted)}
.cap b{color:var(--mint)}

/* ───── 패널 ───── */
.panel{width:296px;height:660px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel.rail{width:56px}
.head{padding:8px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--text);position:relative}
.iconbtn:hover{background:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.navrow{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:var(--text);font-size:13px;text-align:left;position:relative}
.navrow:hover{background:var(--ink)}
.navrow.on{background:var(--ink);box-shadow:inset 2px 0 0 var(--mint)}
.navrow.newbtn{background:var(--mint);color:var(--on-mint);font-weight:700;margin-bottom:4px}
.navrow.newbtn:hover{filter:brightness(.95)}
.rail .nav{align-items:center}
.rail .navrow{width:40px;padding:0;justify-content:center}
.rail .lbl{display:none}
/* 접힌 상태 툴팁 */
.rail .navrow[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#000;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;z-index:10;color:var(--text)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.rail .body{display:none}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 8px}
.user{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;margin-top:auto}
.rail .user{justify-content:center;padding:10px 0}.rail .user span:last-child{display:none}
.av{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--on-mint);font-weight:800;display:grid;place-items:center;font-size:12px}
.sect{font-size:11px;font-weight:600;color:var(--muted);padding:12px 8px 4px}

/* ───── 대화 내역 (v2와 동일) ───── */
.conv{position:relative;display:flex;align-items:center;gap:8px;padding:8px 6px 8px 4px;border-radius:10px;cursor:pointer}
.conv:hover,.conv.open{background:var(--ink)}
.chev{width:16px;flex:none;color:var(--muted);font-size:9px;text-align:center;transition:transform .15s}
.conv.open .chev{transform:rotate(90deg);color:var(--text)}
.conv .t{flex:1;min-width:0}
.conv .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .m{font-size:11px;color:var(--muted);margin-top:2px}
.doccount{display:flex;align-items:center;gap:5px;flex:none;color:var(--mint);font-size:14px;font-weight:700}
.sheets{margin:2px 0 8px 22px;padding-left:14px;display:flex;flex-direction:column;gap:4px}
.sheets[hidden]{display:none}
.sheets .sheet{position:relative}
.sheets .sheet::before{content:"";position:absolute;left:-14px;top:50%;width:12px;border-top:2px solid var(--line)}
.sheets .sheet::after{content:"";position:absolute;left:-14px;top:-4px;height:calc(100% + 4px);border-left:2px solid var(--line)}
.sheets .sheet:last-child::after{height:calc(50% + 4px)}

/* ───── 견적서 카드 (공통) ───── */
.sheet{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
.sheet:hover{border-color:var(--line2)}
.sheet.on{background:rgba(96,237,192,.08);border-color:var(--mint)}
.sheet .dico{flex:none;color:var(--info)}
.sheet.on .dico{color:var(--mint)}
.sheet .t{flex:1;min-width:0}
.sheet .n{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .m{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
.sheet .price{flex:none;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet.on .price{color:var(--mint)}

/* ───── 저장한 견적: 필터·정렬 ───── */
.filters{padding:8px 10px 6px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:11px;color:var(--muted);font-weight:600;width:34px;flex:none}
.chip{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:rgba(96,237,192,.12);border-color:var(--mint);color:var(--mint)}
.chip .arr{font-size:11px}
.count{font-size:11px;color:var(--muted);padding:8px 10px 2px;display:flex;justify-content:space-between}
.flat{display:flex;flex-direction:column;gap:5px;padding:4px 0}
.none{color:var(--muted);font-size:12px;line-height:1.6;padding:16px 10px}

.legend{max-width:360px;font-size:13px;line-height:1.75;color:var(--muted)}
.legend b{color:var(--text)}
.legend ul{padding-left:18px;margin:8px 0 0}
.legend li{margin-bottom:6px}
</style>
</head>
<body>
<h1>좌측 패널 v3 — '대화 내역'과 '저장한 견적'을 별도 탭으로 분리</h1>
<p class="lead">지금의 안쪽 탭(대화 내역 | 견적)을 없애고, 패널의 <b>메뉴 항목</b> 두 개로 분리했습니다. 접힌 상태에서도 아이콘 두 개가 따로 보이고, 마우스를 올리면 각각 “대화 내역”, “저장한 견적” 이름이 뜹니다. 가운데 패널은 <b>대화 내역</b>, 오른쪽 패널은 <b>저장한 견적</b>이 열린 상태이며 각 패널의 메뉴를 눌러 서로 바꿀 수 있습니다. 저장한 견적의 필터·정렬은 실제로 동작합니다.</p>

<div class="stage">
  <div class="col">
    <div class="cap"><b>접힌 상태</b> — 아이콘 위에 마우스</div>
    <div class="panel rail" id="rail"></div>
  </div>
  <div class="col">
    <div class="cap"><b>대화 내역</b> 탭</div>
    <div class="panel" id="p1"></div>
  </div>
  <div class="col">
    <div class="cap"><b>저장한 견적</b> 탭 — 시간 순 나열 + 필터</div>
    <div class="panel" id="p2"></div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<script>
const $=(q,r=document)=>r.querySelector(q);
const ICON={
  toggle:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chat:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>',
  saved:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
  doc:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v19M14 3H7"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  dico:'<svg class="dico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>'
};
// 샘플 데이터 — body: 본체 부품 수, periph: 주변기기 수(없으면 0)
const T=(d,h,m)=>new Date(2026,8,d,h,m).getTime();
const CONVS=[
  {t:'150만원 게이밍 PC',when:T(30,16,25),g:'오늘',sheets:[
    {n:'GPU 상향 안 + 모니터',p:2140000,body:8,periph:3,at:T(30,16,25)},
    {n:'GPU 상향 안',p:1620000,body:8,periph:0,at:T(30,16,20)},
    {n:'가성비 안',p:1480000,body:8,periph:0,at:T(30,14,10)}]},
  {t:'영상 편집용 PC',when:T(30,9,13),g:'오늘',sheets:[
    {n:'램 64GB',p:2320000,body:8,periph:0,at:T(30,11,0)},
    {n:'저소음 케이스',p:2380000,body:8,periph:0,at:T(29,17,40)}]},
  {t:'책상 세팅',when:T(28,20,5),g:'지난 7일',sheets:[
    {n:'27인치 모니터 세트',p:520000,body:0,periph:3,at:T(28,20,5)}]},
  {t:'사무용 미니 PC',when:T(26,14,10),g:'지난 7일',sheets:[
    {n:'최종',p:680000,body:8,periph:0,at:T(26,14,10)}]},
  {t:'키보드·마우스 교체',when:T(25,10,30),g:'지난 7일',sheets:[
    {n:'저소음 키보드+마우스',p:180000,body:0,periph:2,at:T(25,10,30)}]}
];
const ALL=CONVS.flatMap(c=>c.sheets.map(s=>({...s,conv:c.t})));
const won=n=>Math.round(n/10000).toLocaleString('ko-KR')+'만';
const clock=d=>(d.getHours()<12?'오전':'오후')+' '+(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0');
const shortD=ms=>{const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+clock(d)};
const fullD=ms=>{const d=new Date(ms);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+clock(d)};
const meta=s=>[s.body?'부품 '+s.body:'',s.periph?'주변기기 '+s.periph:'',shortD(s.at)].filter(Boolean).join(' · ');
const sheetHTML=(s,on)=>'<div class="sheet'+(on?' on':'')+'" data-sheet>'+ICON.dico+'<div class="t"><div class="n">'+s.n+'</div><div class="m">'+meta(s)+'</div></div><span class="price">'+won(s.p)+'</span></div>';

// ── 공통: 메뉴(새 견적 / 대화 내역 / 저장한 견적) ──
function navHTML(active){
  return '<div class="nav">'+
    '<button class="navrow newbtn" data-tip="새 견적">'+ICON.plus+'<span class="lbl">새 견적 (새 대화)</span></button>'+
    '<button class="navrow'+(active==='chats'?' on':'')+'" data-go="chats" data-tip="대화 내역">'+ICON.chat+'<span class="lbl">대화 내역</span></button>'+
    '<button class="navrow'+(active==='saved'?' on':'')+'" data-go="saved" data-tip="저장한 견적">'+ICON.saved+'<span class="lbl">저장한 견적</span></button>'+
  '</div>';
}
const userHTML='<div class="user"><span class="av">t</span><span>test 님</span></div>';

// ── 대화 내역 뷰 ──
function chatsHTML(){
  let h='<div class="list">';let last='';
  CONVS.forEach((c,i)=>{
    if(c.g!==last){h+='<div class="sect">'+c.g+'</div>';last=c.g}
    const open=i===0;
    h+='<div class="conv'+(open?' open':'')+'" data-conv><span class="chev">▶</span><div class="t"><div class="n">'+c.t+'</div><div class="m">'+fullD(c.when)+'</div></div><span class="doccount">'+ICON.doc+c.sheets.length+'</span></div>';
    h+='<div class="sheets"'+(open?'':' hidden')+'>'+[...c.sheets].sort((a,b)=>b.at-a.at).map((s,j)=>sheetHTML(s,open&&j===0)).join('')+'</div>';
  });
  return h+'</div>';
}

// ── 저장한 견적 뷰: 시간 순 나열 + 필터 ──
function savedHTML(id){
  return '<div class="filters">'+
    '<div class="frow"><span class="flabel">정렬</span>'+
      '<button class="chip on" data-sort="date">날짜 <span class="arr">↓</span></button>'+
      '<button class="chip" data-sort="price">가격 <span class="arr">↑</span></button></div>'+
    '<div class="frow"><span class="flabel">종류</span>'+
      '<button class="chip on" data-kind="body">PC 본체</button>'+
      '<button class="chip on" data-kind="periph">PC 주변기기</button></div>'+
  '</div><div class="count"><span data-count></span><span></span></div><div class="list"><div class="flat" data-flat></div></div>';
}
function wireSaved(root){
  const st={key:'date',dir:{date:-1,price:1},kinds:{body:true,periph:true}};
  const render=()=>{
    let rows=ALL.filter(s=>(st.kinds.body&&s.body>0)||(st.kinds.periph&&s.periph>0));
    const k=st.key,d=st.dir[k];
    rows.sort((a,b)=>d*((k==='date'?a.at-b.at:a.p-b.p))||b.at-a.at);
    $('[data-count]',root).textContent='견적서 '+rows.length+'개';
    $('[data-flat]',root).innerHTML=rows.length?rows.map((s,i)=>sheetHTML(s,false)).join(''):'<div class="none">조건에 맞는 견적서가 없어요.</div>';
    root.querySelectorAll('[data-sort]').forEach(b=>{const on=b.dataset.sort===st.key;b.classList.toggle('on',on);$('.arr',b).textContent=st.dir[b.dataset.sort]<0?'↓':'↑'});
    root.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',st.kinds[b.dataset.kind]));
    root.querySelectorAll('[data-flat] [data-sheet]').forEach(el=>el.addEventListener('click',()=>{root.querySelectorAll('[data-flat] [data-sheet]').forEach(x=>x.classList.remove('on'));el.classList.add('on')}));
  };
  root.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.sort; if(st.key===k)st.dir[k]*=-1; else st.key=k; render();
  }));
  root.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.kind, other=k==='body'?'periph':'body';
    if(st.kinds[k]&&!st.kinds[other])return;          // 둘 다 끄는 것은 막는다(전체로 보임)
    st.kinds[k]=!st.kinds[k]; render();
  }));
  render();
}

// ── 패널 조립 ──
function mount(id,view){
  const el=document.getElementById(id);
  const draw=v=>{
    el.innerHTML='<div class="head"><button class="iconbtn" title="패널 접기">'+ICON.toggle+'</button></div>'+navHTML(v)+
      '<div class="body">'+(v==='chats'?chatsHTML():savedHTML(id))+'</div>'+userHTML;
    el.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.go)));
    if(v==='saved')wireSaved(el);
    el.querySelectorAll('[data-conv]').forEach(c=>c.addEventListener('click',()=>{
      const sh=c.nextElementSibling;sh.hidden=!sh.hidden;c.classList.toggle('open',!sh.hidden);
    }));
    el.querySelectorAll('.sheets [data-sheet]').forEach(s=>s.addEventListener('click',()=>{
      el.querySelectorAll('.sheets [data-sheet]').forEach(x=>x.classList.remove('on'));s.classList.add('on');
    }));
  };
  draw(view);
}
mount('p1','chats');mount('p2','saved');
// 접힌 상태
$('#rail').innerHTML='<div class="head"><button class="iconbtn" title="패널 펴기">'+ICON.toggle+'</button></div>'+navHTML('chats')+'<div class="body"></div>'+userHTML;

document.getElementById('legend').innerHTML=`<b>바뀐 점</b><ul>
<li>안쪽 탭(대화 내역 | 견적)을 <b>없앰</b>. 대신 패널 메뉴가 <b>새 견적 / 대화 내역 / 저장한 견적</b> 세 줄.</li>
<li>접힌 상태에서도 <b>대화 내역</b>(폴더 아이콘)과 <b>저장한 견적</b>(문서 아이콘)이 각각 보이고, 마우스를 올리면 이름이 뜸. 눌러서 펴면 해당 탭이 열림.</li>
<li><b>저장한 견적</b>은 대화별로 묶지 않고 <b>견적서를 시간 순으로 쭉 나열</b>. (지금은 부모 행 + 하위 견적서가 겹쳐 같은 견적서가 두 번 보이는 것처럼 보였음)</li>
<li><b>정렬</b>: 날짜 · 가격 두 버튼. 선택된 버튼을 다시 누르면 ↑/↓가 바뀜(날짜 기본 ↓ 최신순, 가격 기본 ↑ 낮은순).</li>
<li><b>종류</b>: PC 본체 · PC 주변기기 두 칩. 둘 다 켜면 전체, 하나만 켜면 그 종류가 들어 있는 견적서만. 둘 다 끄는 것은 막음(전체로 보임).</li>
<li>본체와 주변기기가 함께 든 견적서(예: “GPU 상향 안 + 모니터”)는 <b>두 칩 어느 쪽에서도</b> 보임.</li>
<li>주변기기 개수는 부품과 <b>같은 글씨 색</b>.</li>
</ul>
<br><b>질문</b><ul>
<li>“PC 부품”을 <b>PC 주변기기</b>(모니터·키보드·마우스·스피커)로 해석했습니다. 다른 뜻이면 알려 주세요.</li>
<li>본체·주변기기가 <b>같이 든 견적서만</b> 따로 보는 필터가 필요한지도 알려 주세요(지금은 없음).</li>
</ul>`;
</script>
</body>
</html>
