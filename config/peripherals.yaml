      clarity:     {label: 소리 또렷함, type: taste, group: purpose, aliases: [], sides: {clear: 또렷한 편, warm: 부드러운 편}, taste_labels: {소리 또렷한 쪽: clear}}

# adjust_chips: 추천 결과 아래 "더 맞추기" 칩의 후보(견적 입력 설계 6.2, 5장의 칩 목록).
# 칩 하나 = 눌렀을 때 입력에 더해지는 값(add). 서버는 후보마다 "더했을 때 지금 보이는 순서(1위와 대안 2개)가
# 바뀌는가"를 계산해서 바꾸는 것만, 최대 3개 내보낸다(src/engine/peripheral_suggest.py). 이미 말한 조건의 칩은 내지 않는다.
# 손 크기·키압 쪽 칩은 체감 점수(구현 순서 6)와 키압 컬럼(요청서 B-8)이 들어온 뒤에 더한다 — 지금은 순서를
# 바꾸지 못하므로 어차피 나오지 않는다.
#   add.purposes / add.situations — 목적·상황 코드. add.stated — 직접 말한 스펙 조건 이름(그 종류의 spec_conditions).
adjust_chips:
  monitor:
    - {id: bright_room, label: 방이 밝은 편이에요, add: {purposes: [bright_room]}}
    - {id: small_desk, label: 책상이 좁아요, add: {situations: [small_desk]}}
  keyboard:
    - {id: quiet_place, label: 조용해야 해요, add: {situations: [quiet_place]}}
    - {id: numbers, label: 숫자 키가 필요해요, add: {purposes: [numbers]}}
  mouse:
    - {id: quiet_place, label: 조용해야 해요, add: {situations: [quiet_place]}}
  speaker:
    - {id: desk_casual, label: 책상 위에서 써요, add: {purposes: [desk_casual]}}
    - {id: room, label: 방 전체에 울려야 해요, add: {purposes: [room]}}
    - {id: low_volume, label: 밤에 작게 들어요, add: {purposes: [low_volume]}}

# interpretation: 문장 해석의 남용 방어(견적 입력 설계 10장). 값은 잠정이다.
interpretation:
  max_chars: 300          # 이보다 긴 문장은 앞부분만 해석한다
  cache_size: 512         # 같은 문장(공백·대소문자 정리)을 다시 해석하지 않기 위한 서버 안 저장 개수
  per_minute: 20          # 주소별 분당 요청 수

# E12 — 모니터↔PC 교차 검사(추천엔진_구현계획 §3.3 E12). 코드는 src/engine/peripheral_cross.py.
# 결과는 모니터 품목의 쟁점으로만 들어가고 PC 세트 신뢰도에는 영향을 주지 않는다.
#
# port_modes: 단자 버전 → 그 버전이 (DSC 없이) 낼 수 있는 해상도 등급별 최대 주사율(Hz).
# **잠정값이며 출처 확인이 필요하다** — HDMI Forum·VESA 규격의 대역폭(HDMI 1.4 10.2Gbps,
# 2.0 18Gbps, 2.1 48Gbps / DP 1.2 21.6Gbps, 1.4 32.4Gbps, 2.1 80Gbps)에서 8bit 색·일반
# 블랭킹을 가정해 어림한 값이다. 표에 없는 등급(QHD_WIDE·OTHER)은 판정하지 않고 Pending이다.
# 버전은 "주.부" 문자열로 적는다. 실제 버전이 표에 없으면(예: 2.0b) 그 이하 중 가장 높은
# 버전의 행을 쓴다(peripheral_cross.mode_row).
#
# 그래픽카드 쪽 단자 데이터(gpu_spec 의 hdmi_version/dp_version/포트 수)는 아직 카탈로그에
# 없다(R-1). 그래서 지금은 단자 검사가 항상 Pending 이다. GPU 후보 specs 에 gpu_keys 의 키가
# 생기면(catalog_repo SELECT 추가만으로) 코드 변경 없이 ok/fail 로 판정된다.
verify:
  gpu_keys:
    hdmi_version: hdmi_version
    hdmi_ports: hdmi_ports
    dp_version: dp_version
    dp_ports: dp_ports
    usb_c_video_out: usb_c_video_out     # USB-C(DP Alt)/Thunderbolt 영상 출력 여부(bool)
  port_modes:                            # 잠정값 — 출처 필요
    hdmi:
      "1.4": {FHD: 120, QHD: 75, UHD: 30}
      "2.0": {FHD: 240, QHD: 144, UHD: 60}
      "2.1": {FHD: 360, QHD: 240, UHD: 144}
    dp:
      "1.2": {FHD: 240, QHD: 165, UHD: 60}
      "1.4": {FHD: 360, QHD: 240, UHD: 120}
      "2.1": {FHD: 480, QHD: 360, UHD: 240}
