      {label: 장문 타이핑·코딩, words: [글 많이, 타이핑, 코딩, 개발자], prefer: [], feel: [타건감, 손목 피로], taste: []}
    numbers:
      {label: 사무·숫자 입력, words: [회계, 엑셀, 숫자, 텐키], prefer: [full_size], feel: [배열 적응], taste: [소리 조용한 쪽]}
