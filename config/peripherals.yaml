# 주변기기(모니터·키보드·마우스·스피커) 정의 — 추천엔진 구현계획 §3.3 E8.
#
# 왜 config/categories/ 밖에 있는가: src/categories.py의 available_categories()가
# categories/*.yaml 파일 이름을 그대로 세션의 카테고리 선택지로 훑는다(categories.py:40).
# 이 파일을 그 디렉터리 안에 두면 "peripherals"가 새 카테고리로 화면에 나타난다.
# 주변기기는 독립된 카테고리가 아니라 "computer" 요청의 부속 결과다(Category는 여전히
# "computer" 하나뿐, src/dto.py) — 그래서 정의 파일도 카테고리 디렉터리 밖에 둔다.
#
# 가격의 성격: 여기서 다루는 가격은 전부 catalog.peripheral_price_snapshot 관측이며,
# 판매처·관측일을 모른다("reference_snapshot"). PC 부품의 offer/offer_observation과
# 달리 구매 가능한 가격이 아니고, PC 총액에도 합산하지 않는다(계획 §3.3, R-3).
# 판매처·관측일이 있는 가격이 offer 경로로 들어오면(R-3) price_source가 "observed"로
# 바뀐다 — 그 전까지 이 파일이 다루는 값은 전부 참고가다.
#
# E8 에서 채운 것은 kinds(스펙 컬럼 매핑)와 ranking(가중치), E9 가 채운 것은 parsing 이다.
# requirements(요구사양 룩업)는 E10, verify(모니터↔PC 교차 검사)는 E12 가 채웠다.
# hard_filters·preferences 절은 쓰지 않는다 — E11 은 requirements.<kind>.hard/soft 를 그대로
# 평가한다. 로더(src/engine/peripheral_rules.py)는 두 이름을 "알려진 선택 절"로 예약만 해 둔다.
schema_version: 1
rule_set_version: peripheral-rules-v3   # v2: verify 절(E12) 추가 · v3: 견적 입력 절 추가, requirements.soft 제거

kinds:
  monitor:
    label: 모니터
    product_type: monitor   # catalog.product.product_type (docker exec db psql로 확인, db/seed_peripherals.py와 일치)
    spec_table: catalog.monitor_spec
    # DB 컬럼 → 엔진 spec 키. 값이 원문 텍스트(파싱 전)인 컬럼은 `_raw` 접미사를 붙여
    # 이미 구조화된 값(숫자·불리언·배열)과 구분한다. 텍스트 해석은 E9(peripheral_parse.py)가 한다.
    # product_url·manual_reference는 스펙이 아니라 출처 메타데이터라 여기 넣지 않는다
    # (src/dto.py Candidate.provenance 주석과 같은 원칙 — 섞으면 [3-B] data_gap 감점이 메타데이터를 스펙으로 센다).
    columns:
      model_code: model_code_raw
      screen_size_inch: screen_size_inch
      resolution: resolution_raw            # 예: "2560x1440" → E9가 (w, h, class)로 해석
      max_refresh_hz: refresh_hz            # 이미 숫자라 파싱 불필요
      panel: panel_raw
      response_ms_gtg: response_ms_gtg
      brightness_nit: brightness_nit
      curvature: curvature_raw
      hdmi_version: hdmi_version_raw
      hdmi_ports: hdmi_ports
      dp_version: dp_version_raw
      dp_ports: dp_ports
      dp_connector: dp_connector_raw
      usb_c_video_input: usb_c_video_input_raw
      usb_c_power_w: usb_c_power_w
      vesa_mount_mm: vesa_mount_mm_raw
      port_limits: port_limits_raw
      note: note_raw
      weight_g: weight_g
      size_mm: size_mm_raw

  keyboard:
    label: 키보드
    product_type: keyboard
    spec_table: catalog.keyboard_spec
    columns:
      switch_kind: switch_kind_raw
      switch_method: switch_method_raw      # E10 소음 선호(quiet/noise_sensitive)가 볼 클릭형 여부
      rapid_trigger: rapid_trigger          # 이미 boolean
      connectivity: connectivity            # 이미 text[]
      weight_g: weight_g
      size_mm: size_mm_raw
      connectivity_interface: connectivity_interface

  mouse:
    label: 마우스
    product_type: mouse
    spec_table: catalog.mouse_spec
    columns:
      model_number: model_number_raw
      category_label: category_label_raw
      form_factor: form_factor_raw
      sensor: sensor_raw
      dpi_range: dpi_range_raw              # 예: "100~8,000" → E9가 최댓값만 취함
      polling_rate: polling_rate_raw        # 예: "125~2,000Hz" → E9가 최댓값(2000)만 취함. 84행 중 57행 공란(C6)
      button_count: button_count_raw
      switch_click: switch_click_raw
      connectivity: connectivity
      battery_power: battery_power_raw
      color_options: color_options_raw
      weight_g: weight_g
      size_mm: size_mm_raw
      connectivity_interface: connectivity_interface

  speaker:
    label: 스피커
    product_type: speaker
    spec_table: catalog.speaker_spec
    columns:
      speaker_form: speaker_form_raw
      connectivity: connectivity
      channels: channels_raw                # 예: "2.1" → E9가 채널 수로 해석
      output_power: output_power_raw        # 예: "10W x2" → E9가 총 출력으로 해석
      impedance: impedance_raw
      signal_noise_ratio: signal_noise_ratio_raw
      sensitivity: sensitivity_raw
      power_source: power_source_raw
      enclosure: enclosure_raw
      note: note_raw
      weight_g: weight_g
      size_mm: size_mm_raw
      connectivity_interface: connectivity_interface

# 종류별 랭킹 가중치. 축은 가격/선호적합/데이터충실/리뷰 넷으로 고정하고 합은 1이다.
# "리뷰" 축의 값은 체감 적합도 R 이다(src/engine/peripheral_feel.py, 개발_확정사양 6장). 사용기 근거가 없으면 외부 리뷰
# 점수로 계산한 R 이고, 목적·상황에 따라 속성별 중요도가 달라진다. 이 축의 가중치가 0이면 R 은 설명용이고 순위에 영향을
# 주지 않는다. 이 값을 올리면 다른 축을 줄여 합을 1로 맞춘다.
# 값은 전부 잠정치다 — 실측 근거 없이 임의로 배분했고, 사용기가 쌓인 뒤 재조정 대상이다. 배분의 생각: 가격과 스펙 선호가
# 합쳐 55~60% 로 여전히 중심이고, 체감 R 이 25~30% 를 맡는다. 데이터충실(스펙 결손 감점)은 예전 25~30% 에서 15% 로 낮췄다 —
# 같은 결손이 R 의 출발값(외부 점수)에도 반영되기 때문이다. 옛 배분: 모니터 .35/.35/.30, 키보드·마우스 .40/.35/.25, 스피커 .45/.30/.25.
ranking:
  monitor:
    weights: {가격: 0.30, 선호적합: 0.30, 데이터충실: 0.15, 리뷰: 0.25}   # 잠정값
  keyboard:
    weights: {가격: 0.30, 선호적합: 0.25, 데이터충실: 0.15, 리뷰: 0.30}   # 잠정값
  mouse:
    weights: {가격: 0.30, 선호적합: 0.25, 데이터충실: 0.15, 리뷰: 0.30}   # 잠정값
  speaker:
    weights: {가격: 0.35, 선호적합: 0.25, 데이터충실: 0.15, 리뷰: 0.25}   # 잠정값

# E9 — 원문 스펙 텍스트 파서(src/engine/peripheral_parse.py)가 쓰는 분류표.
# resolution_classes: 모니터 해상도 "WxH" → 등급 이름. data/peripherals/monitor_processed.csv
# 실측 8종 해상도(1920x1080·2560x1440·3440x1440·3840x2160·5120x1440·5120x2160·5120x2880·
# 6144x3456) 중 여기 없는 조합(5K 계열, 6144x3456 등)은 파싱 실패가 아니라 class="OTHER"로
# 분류된다(계획 §3.3 E9) — 미분류일 뿐 원문 파싱 자체는 성공했다는 뜻이라 None과 구분한다.
# 코드가 아니라 여기 값을 바꾸면 등급 분류가 바뀐다(peripheral_rules.py 로더가 형식을 검증).
parsing:
  resolution_classes:
    FHD: [[1920, 1080]]
    QHD: [[2560, 1440]]
    QHD_WIDE: [[3440, 1440]]
    UHD: [[3840, 2160]]

# E10 — 종류별 요구사양 룩업(추천엔진_구현계획 §3.3 E10). 하드 조건은 monitor 에만 둔다 —
# PC 견적과의 호환(해상도·주사율)이라 목적에서 추론한 것이 아니다. 값은 **잠정값**이다.
# 나머지 셋(키보드·마우스·스피커)은 데이터 결손이 커서(마우스 폴링레이트 84행 중 57행 공란 — C6)
# 하드 조건을 걸지 않는다. 선호는 아래 spec_conditions·purposes 가 맡는다(견적 입력 설계 5장).
# 코드는 src/engine/peripheral_requirement.py.
requirements:
  monitor:
    # 하드: PC 조건 resolution(FHD_144/QHD_165/4K) → 허용 resolution_class 목록 + 주사율
    # 하한. "이상"이 아니라 "일치"로 두는 이유(계획 §3.3): PC 의 GPU 등급이 이 해상도를
    # 목표로 잡혔다. 4K 모니터를 FHD 용 GPU 에 붙이면 성능 목표가 어긋난다.
    hard:
      # 해상도 enum → "정등급"(주 등급) 하나. 등급 이름은 위 parsing.resolution_classes 에
      # 있어야 한다(로더 검증).
      resolution_class_by_res:
        FHD_144: FHD
        QHD_165: QHD
        "4K": UHD
      # 정등급 → 하드 조건에 실제로 허용할 resolution_class 목록. 기본은 정등급 자기
      # 자신만 포함한다 — QHD_165 에 QHD_WIDE(3440x1440)를 포함하지 않는다.
      # 이유: GPU 목표가 16:9 QHD(2560x1440, 약 369만 화소) 기준으로 잡혔는데 QHD_WIDE 는
      # 3440x1440(약 495만 화소)로 화소가 약 34% 더 많다 — 같은 GPU 등급으로는 목표
      # 프레임을 못 미친다. 울트라와이드를 포함하도록 정책이 바뀌면 이 표에 QHD_WIDE 를
      # 추가하면 된다(코드 변경 없음).
      res_class_members:
        FHD: [FHD]
        QHD: [QHD]
        UHD: [UHD]
      # 해상도 enum → 주사율 하한(Hz). 계획 표: FHD_144→144, QHD_165→165, 4K→60(게임이면 120).
      refresh_min_hz_by_res:
        FHD_144: 144
        QHD_165: 165
        "4K": 60
      # {해상도: {purpose: 하한}} — 있으면 refresh_min_hz_by_res 값을 덮어쓴다.
      # purpose 는 PC 견적의 용도(computer.yaml slot_schema)다. 주변기기 목적(purposes)과 다른 말이다.
      refresh_min_hz_purpose_override:
        "4K":
          game: 120

# ── 견적 입력(docs/local/견적_입력_설계.md 4~5장, 개발_확정사양.md 8장) ───────────────────
# 사용자가 한 문장으로 말한 것을 "정해진 목록 안의 값"으로만 읽는다. 아래 절들이 그 목록이다.
# 값을 바꾸면 해석 결과가 바뀌므로 rule_set_version 을 함께 올린다(문장 해석 저장 키에 들어간다).
# 임계값(g·mm·nit 등)은 전부 **잠정값**이다 — 카탈로그 분포를 보고 임시로 둔 값이고 실제 사용 뒤 조정한다.
#
# spec_conditions: 종류별 닫힌 목록. 한 항목 = 이름 붙은 스펙 조건 하나.
#   prefs  — 평가기({key, op, value}) 형식. key 는 해당 종류의 판정 가능 키여야 한다(로더 검증).
#   words  — 사용자가 이 조건을 직접 말할 때 쓰는 낱말(소문자 부분 일치). 단어 규칙과 모델 프롬프트가 쓴다.
#   filter — true 면 사용자가 **직접 말했을 때** 후보를 거른다(고른 제품이 사라져도 되는 조건).
#            false 면 직접 말해도 선호로만 쓴다(임계값이 잠정이라 거르면 오히려 제품이 사라지는 조건).
#            목적에서 풀린 조건은 filter 값과 무관하게 항상 선호로만 쓴다(설계 5.1).
#   ＊ 표시는 이 설계에서 새로 정의한 7개다(견적 입력 설계 8장).
spec_conditions:
  monitor:
    high_resolution:   # ＊
      label: 높은 해상도
      words: [고해상도, 해상도 높, 높은 해상도]
      filter: false
      prefs: [{key: resolution_h, op: min, value: 1440}]          # QHD 이상. 잠정
    high_refresh:
      label: 높은 주사율
      words: [고주사율, 주사율 높, 144hz, 165hz, 240hz]
      filter: false
      prefs: [{key: refresh_hz, op: min, value: 144}]             # 잠정
    fast_response:
      label: 빠른 응답속도
      words: [응답속도]
      filter: false
      prefs: [{key: response_ms_gtg, op: max, value: 5}]          # GTG ms. 잠정
    large_screen:
      label: 큰 화면
      words: [큰 화면, 대형]
      filter: false
      prefs: [{key: screen_size_inch, op: min, value: 32}]        # 잠정
    oled:
      label: OLED
      words: [oled, 올레드]
      filter: true
      prefs: [{key: panel_raw, op: contains_any, value: [OLED]}]
    ips:
      label: IPS
      words: [ips]
      filter: true
      prefs: [{key: panel_raw, op: contains_any, value: [IPS]}]
    usb_c:             # ＊
      label: USB-C 영상·충전
      words: [usb-c, c타입, 썬더볼트]
      filter: false
      prefs:
        - {key: usb_c_video, op: equals, value: true}
        - {key: usb_c_power_w, op: min, value: 60}                # W. 잠정
    bright:            # ＊
      label: 높은 밝기
      words: [밝은 모니터, 밝기 높, 높은 밝기]
      filter: false
      prefs: [{key: brightness_nit, op: min, value: 400}]         # nit. 잠정
  keyboard:
    wireless:
      label: 무선
      words: [무선]
      filter: true
      prefs: [{key: connectivity_wireless, op: equals, value: true}]
    bluetooth:
      label: 블루투스
      words: [블루투스]
      filter: true
      prefs: [{key: connectivity_bluetooth, op: equals, value: true}]
    quiet_switch:
      label: 조용한 스위치
      words: [저소음 스위치, 저소음축, 저소음 축, 무소음 스위치]
      filter: false
      prefs: [{key: switch_clicky, op: equals, value: false}]
    rapid_trigger:
      label: 래피드 트리거
      words: [래피드 트리거, 래피드트리거]
      filter: true
      prefs: [{key: rapid_trigger, op: equals, value: true}]
    magnetic:
      label: 마그네틱(자석축)
      words: [마그네틱, 자석축, 홀 이펙트]
      filter: true
      prefs: [{key: switch_magnetic, op: equals, value: true}]
    full_size:
      label: 풀배열
      words: [풀배열, 풀사이즈]
      filter: false
      # 카탈로그에 배열 컬럼이 없어 가로 길이로 근사한다. 잠정
      prefs: [{key: size_longest_mm, op: min, value: 430}]
    compact:
      label: 텐키리스·컴팩트
      words: [텐키리스, 컴팩트]
      filter: false
      prefs: [{key: size_longest_mm, op: max, value: 380}]        # 잠정
    low_height:        # ＊
      label: 낮은 높이
      words: [저상, 로우프로파일, 낮은 키보드]
      filter: false
      prefs: [{key: size_height_mm, op: max, value: 30}]          # mm. 잠정
  mouse:
    wireless:
      label: 무선
      words: [무선]
      filter: true
      prefs: [{key: connectivity_wireless, op: equals, value: true}]
    bluetooth:
      label: 블루투스
      words: [블루투스]
      filter: true
      prefs: [{key: connectivity_bluetooth, op: equals, value: true}]
    lightweight:
      label: 가벼운 무게
      words: [경량, 가벼운, 가벼워]
      filter: false
      prefs: [{key: weight_g, op: max, value: 80}]                # g. 잠정
    high_polling:
      label: 높은 폴링레이트
      words: [폴링, 4000hz, 8000hz]
      filter: false
      prefs: [{key: polling_hz_max, op: min, value: 1000}]
    small_size:        # ＊
      label: 작은 크기
      words: [작은 마우스, 작은 크기, 미니]
      filter: false
      prefs: [{key: size_longest_mm, op: max, value: 110}]        # mm. 잠정
    many_buttons:      # ＊
      label: 버튼 많음
      words: [버튼 많]
      filter: false
      prefs: [{key: button_count, op: min, value: 8}]             # 잠정
    vertical_trackball:  # ＊
      label: 버티컬·트랙볼 형태
      words: [버티컬, 트랙볼]
      filter: true
      prefs: [{key: form_factor_raw, op: contains_any, value: [버티컬, 트랙볼]}]
  speaker:
    bluetooth:
      label: 블루투스
      words: [블루투스]
      filter: true
      prefs: [{key: connectivity_bluetooth, op: equals, value: true}]
    usb_power:
      label: USB 전원
      words: [usb 전원, usb로]
      filter: true
      prefs: [{key: power_source_raw, op: contains_any, value: [USB]}]
    small_size:
      label: 작은 크기
      words: [작은 스피커, 컴팩트]
      filter: false
      prefs: [{key: size_longest_mm, op: max, value: 200}]        # mm. 잠정
    high_output:
      label: 높은 출력
      words: [출력 높, 고출력]
      filter: false
      prefs: [{key: output_w, op: min, value: 20}]                # W. 잠정
    bookshelf:
      label: 북셸프
      words: [북셸프]
      filter: true
      prefs: [{key: speaker_form_raw, op: contains_any, value: [북셸프]}]
    channel_2_1:
      label: 2.1 채널
      words: ["2.1"]
      filter: false
      prefs: [{key: channels, op: min, value: 2.1}]

# purposes: 종류별 목적 목록과 풀이(견적 입력 설계 5.3~5.6). 목적 하나는 세 군데로 풀린다.
#   prefer — 선호 스펙(spec_conditions 이름). 이 값만 이 단계의 스펙 선호 계산에 쓴다.
#   feel   — 중요해지는 체감. 체감 점수를 계산하는 단계(구현 순서 6)가 쓴다. 지금은 화면 설명용 이름이다.
#   taste  — 취향의 쪽. 위와 같다.
#   words  — 단어 규칙(언어 모델을 쓸 수 없을 때)과 모델 프롬프트의 예시가 되는 낱말. 부분 일치, 소문자.
# "게임용"이라고만 말하면 game 으로 읽는다. 스펙을 좁히지 않고(prefer 없음) 체감 중요도만 올린다(설계 5.1).
# 같은 이름의 목적이 여러 종류에 있으면(game, fps, wrist, multi_device …) 한 번 말한 것이 모든 종류에 적용된다.
