category: computer
label: "컴퓨터 (PC 본체 조립)"
modes: [build, upgrade]
required_inputs: [mode, purpose, budget_max, priority]
required_inputs_by_mode:               # mode별 추가 필수 (§D-4-1)
  upgrade: [upgrade_parts]
slot_structure: [CPU, GPU, RAM, 메인보드, 저장장치, 파워, 케이스, 쿨러]
verify_branch: set            # [4] 세트 최적화 → [3-C] 세트 검증

slot_schema:
  purpose:         { type: enum, values: [game, creation, office, study, other] }
  budget_max:      { type: int, nullable: true }
  priority:        { type: enum, values: [performance, value, quiet], nullable: true }
  games:           { type: list }
  resolution:      { type: enum, values: [FHD_144, QHD_165, "4K"], nullable: true }
  assembly:        { type: enum, values: [self, service], nullable: true }
  noise_sensitive: { type: bool, nullable: true }
  brand_pref:      { type: enum, values: [intel, amd, none], nullable: true }
  upgrade_parts:   { type: list }        # mode=upgrade 일 때만 필수
  current_specs:   { type: object, nullable: true }   # TODO: 사양 파일 파싱 결정 전까지 자유 텍스트로만 수집
  spec_file_name:  { type: str, nullable: true }       # TODO: 파일 업로드 미구현 — accepts_spec_file=false
  owned:           { type: list }
  # 업그레이드에서 유지하는 부품의 플랫폼 — 사양 파일이 없거나 못 읽을 때 칩으로 되묻는다(ask_when). "unknown" 은 답이다.
  owned_platform:  { type: enum, values: [LGA1151, LGA1200, LGA1700, LGA1851, AM4, AM5, unknown], nullable: true }
  owned_ram_type:  { type: enum, values: [DDR3, DDR4, DDR5, unknown], nullable: true }
  # 구간의 하한(W, 보수적으로). 값은 전부 문자열이다 — 숫자와 문자열 키가 섞이면 시드(JSON sort_keys)가 깨진다.
  owned_psu_w:     { type: enum, values: ["450", "500", "700", "900", unknown], nullable: true }
  extra:           { type: list }

defaults:                      # 동적 기본값 실패 시 fallback
  resolution: FHD_144
  assembly: service
  noise_sensitive: false
  brand_pref: none

# ConditionState.fields 순서·표시 라벨 (§D-4-1 "카테고리별 필드")
fields:
  - {key: mode, label: 구성 방식, display: {build: 새 컴퓨터, upgrade: 업그레이드}}
  - {key: spec_file_name, label: 첨부 사양 파일, mode_only: upgrade}
  - {key: current_specs, label: 현재 사양, mode_only: upgrade}
  - {key: upgrade_parts, label: 업그레이드 부품, mode_only: upgrade}
  - {key: owned_platform, label: 현재 CPU 세대, mode_only: upgrade, ask_when: {upgrade_parts_any: [CPU, 메인보드, 쿨러], unless_current_specs_any: [CPU, 메인보드]}, display: {
    LGA1151: Intel 8~9세대, LGA1200: Intel 10~11세대, LGA1700: Intel 12~14세대, LGA1851: Intel Core Ultra 200, AM4: Ryzen 1000~5000, AM5: Ryzen 7000 이상, unknown: 모름}}
  - {key: owned_ram_type, label: 현재 메모리 종류, mode_only: upgrade, ask_when: {upgrade_parts_any: [RAM, 메인보드], unless_current_specs_any: [RAM]}, display: {DDR3: DDR3,
    DDR4: DDR4, DDR5: DDR5, unknown: 모름}}
  - {key: owned_psu_w, label: 현재 파워 용량, mode_only: upgrade, ask_when: {upgrade_parts_any: [GPU], unless_current_specs_any: [파워]}, display: {'450': 500W 미만,
    '500': 500~650W, '700': 700~850W, '900': 900W 이상, unknown: 모름}}
  - {key: purpose, label: 주요 용도, display: {game: 게임, creation: 창작, office: 사무, study: 학습, other: 기타}}
  - {key: budget_max, label: 예산}
  - {key: priority, label: 우선순위, display: {performance: 성능 우선, value: 가성비, quiet: 저소음}}
  - {key: resolution, label: 해상도·주사율, display: {FHD_144: FHD 144Hz, QHD_165: QHD 165Hz, "4K": 4K}}
  - {key: games, label: 하는 게임}

question_sets:
  - {id: q_mode, select: single, maps_to: mode, label: '새로 만들까요, 업그레이드할까요?', options: [새 컴퓨터 조립, 기존 컴퓨터 업그레이드], values: [build, upgrade]}
  - {id: q_purpose, select: single, maps_to: purpose, label: '주로 어떤 용도로 쓰실 건가요?', options: [게임, 창작·작업, 사무, 학습, 기타], values: [game, creation, office, study,
    other]}
  - {id: q_budget_max, select: free, maps_to: budget_max, label: '예산은 얼마까지 생각하시나요?'}
  - {id: q_priority, select: single, maps_to: priority, label: '가장 중요하게 생각하시는 건 뭔가요?', options: [성능 우선, 가성비, 조용한 게 좋아요], values: [performance, value, quiet]}
  - {id: q_upgrade_parts, select: multi, maps_to: upgrade_parts, label: '어떤 부품을 업그레이드하고 싶으신가요?', options: [CPU, GPU, RAM, 메인보드, 저장장치, 파워, 케이스, 쿨러], mode_only: upgrade}
  # 업그레이드: 호환을 보려면 유지 부품의 플랫폼이 필요하다. 사양 파일에 없을 때만, 필요한 부품을 고른 경우에만 묻는다.
  # 모든 질문에 "모르겠어요"가 있다(그것도 답이라 추천이 막히지 않는다 — 대신 결과에 "확인 못 함"으로 안내된다).
  - {id: q_owned_platform, select: single, maps_to: owned_platform, mode_only: upgrade, ask_when: {upgrade_parts_any: [CPU, 메인보드, 쿨러], unless_current_specs_any: [
      CPU, 메인보드]}, label: '지금 쓰는 CPU는 어느 세대인가요? 메인보드 소켓을 맞추는 데 필요해요.', options: [Intel 8~9세대, Intel 10~11세대, Intel 12~14세대, Intel Core Ultra 200, Ryzen
      1000~5000, Ryzen 7000 이상, 모르겠어요], values: [LGA1151, LGA1200, LGA1700, LGA1851, AM4, AM5, unknown]}
  - {id: q_owned_ram, select: single, maps_to: owned_ram_type, mode_only: upgrade, ask_when: {upgrade_parts_any: [RAM, 메인보드], unless_current_specs_any: [RAM]},
  label: '지금 쓰는 메모리(RAM)는 어떤 종류인가요?', options: [DDR3, DDR4, DDR5, 모르겠어요], values: [DDR3, DDR4, DDR5, unknown]}
  - {id: q_owned_psu, select: single, maps_to: owned_psu_w, mode_only: upgrade, ask_when: {upgrade_parts_any: [GPU], unless_current_specs_any: [파워]}, label: '지금
    쓰는 파워(전원공급장치)는 몇 W인가요? 새 그래픽카드가 버티는지 보려고요.', options: [500W 미만, 500~650W, 700~850W, 900W 이상, 모르겠어요], values: ['450', '500', '700', '900', unknown]}
  - {id: q_resolution, select: single, maps_to: resolution, label: '목표 해상도·주사율은?', options: [FHD 144Hz, QHD 165Hz, 4K, 잘 모르겠어요], values: [FHD_144, QHD_165,
    4K, null]}
  - {id: q_games, select: multi, maps_to: games, label: '어떤 게임을 하시나요?'}
  - {id: q_assembly, select: single, maps_to: assembly, label: '조립은 어떻게 하시겠어요?', options: [직접 조립, 조립 대행], values: [self, service]}
  - {id: q_noise, select: single, maps_to: noise_sensitive, label: '소음에 민감하신 편인가요?', options: [조용한 게 좋아요, 상관없어요], values: [true, false]}
