# PC requirement, ranking, and set-compatibility policy. Change schema_version when
# the structure changes; change rule_set_version when policy values change.
schema_version: 1
rule_set_version: computer-rules-v10

requirements:
  default_resolution: FHD_144
  game_tiers:  # resolution: GPU tier, CPU tier, RAM GB, VRAM GB
    FHD_144: {gpu: 6, cpu: 6, ram_gb: 16, vram_gb: 8}
    QHD_165: {gpu: 7, cpu: 5, ram_gb: 16, vram_gb: 12}
    4K: {gpu: 9, cpu: 5, ram_gb: 32, vram_gb: 16}
  # 게임 제목별 권장 사양 하한(용도가 game 일 때만). 위 game_tiers(해상도)와 같은 1~10 눈금이며, 해상도 요구와
  # 요소별 큰 값을 취한다 — 가벼운 게임은 해상도 요구가 이미 넘으므로 결과가 바뀌지 않고, 무거운 게임만 올린다.
  # 잠정값: 배급사 권장 사양(1080p 고옵션 기준)을 lineup 등급 눈금에 거칠게 옮긴 것이며 팀 확인 전이다.
  # 표에 없는 제목은 해상도 기준 그대로 구성하고 그 사실을 화면 안내에 남긴다. aliases 는 공백·대소문자를
  # 무시하고 비교한다(2글자 이하 별칭은 완전 일치만).
  game_titles:
    valorant:      {aliases: [발로란트, valorant], tier: {gpu: 3, cpu: 6, ram_gb: 8, vram_gb: 2}}
    lol:           {aliases: [리그오브레전드, 롤, lol, leagueoflegends], tier: {gpu: 3, cpu: 5, ram_gb: 8, vram_gb: 2}}
    overwatch2:    {aliases: [오버워치, 오버워치2, overwatch], tier: {gpu: 4, cpu: 5, ram_gb: 8, vram_gb: 4}}
    maplestory:    {aliases: [메이플스토리, 메이플, maplestory], tier: {gpu: 3, cpu: 4, ram_gb: 8, vram_gb: 2}}
    lostark:       {aliases: [로스트아크, lostark], tier: {gpu: 5, cpu: 5, ram_gb: 16, vram_gb: 4}}
    minecraft:     {aliases: [마인크래프트, 마크, minecraft], tier: {gpu: 3, cpu: 5, ram_gb: 8, vram_gb: 2}}
    pubg:          {aliases: [배틀그라운드, 배그, pubg], tier: {gpu: 5, cpu: 6, ram_gb: 16, vram_gb: 6}}
    eldenring:     {aliases: [엘든링, 엘든 링, eldenring], tier: {gpu: 5, cpu: 5, ram_gb: 16, vram_gb: 8}}
    diablo4:       {aliases: [디아블로4, 디아블로 4, diablo4], tier: {gpu: 5, cpu: 5, ram_gb: 16, vram_gb: 8}}
    warzone:       {aliases: [워존, 콜오브듀티, callofdutywarzone, warzone], tier: {gpu: 6, cpu: 6, ram_gb: 16, vram_gb: 8}}
    bg3:           {aliases: [발더스게이트3, baldursgate3, bg3], tier: {gpu: 6, cpu: 6, ram_gb: 16, vram_gb: 8}}
    cyberpunk:     {aliases: [사이버펑크, 사이버펑크2077, cyberpunk2077, cyberpunk], tier: {gpu: 7, cpu: 6, ram_gb: 16, vram_gb: 8}}
    wukong:        {aliases: [검은신화오공, 검은신화, 블랙미스오공, blackmythwukong], tier: {gpu: 7, cpu: 6, ram_gb: 16, vram_gb: 8}}
    monsterhunter: {aliases: [몬스터헌터와일즈, 몬헌와일즈, 몬헌, monsterhunterwilds], tier: {gpu: 7, cpu: 6, ram_gb: 16, vram_gb: 8}}
    starfield:     {aliases: [스타필드, starfield], tier: {gpu: 7, cpu: 7, ram_gb: 16, vram_gb: 8}}
  # DB 카탈로그에는 CPU/GPU 성능 실측이 없어, 수집된 제조사 등급(lineup)을 임시 티어로 쓴다.
  # game_tiers/ideal_tiers 와 같은 1~10 눈금이다. 같은 등급 안의 세대·모델 차이는 구분하지
  # 못하는 거친 대용품이며, 벤치마크 수집 뒤 실측 티어로 교체한다. 표에 없는 등급(GPU의
  # Workstation 등)은 티어를 비워 두어 판정 보류(Pending)로 남긴다. CPU의 "(Gaming)" 접미는
  # 떼고 본다.
  lineup_perf_tier:
    gpu: {Budget: 3, Entry: 5, Mainstream: 6, Mid-Range: 7, High-End: 8, Enthusiast: 9, Flagship: 9, Ultra Flagship: 10}
    cpu: {Entry: 4, Mainstream: 6, Mid-Range: 7, High-End: 8, Enthusiast: 9, Flagship: 9, Ultra Flagship: 10}
  # 용도별 요구 프로필 — 2026-09-21 사용자 확인 반영(숫자는 카탈로그 공급 여건 기준이며 바뀔 수 있다).
  # 여기 없는 용도(game, 미지정)는 위 game_tiers 를 해상도로 골라 쓴다. 프로필에 적은
  # 키만 이 문서의 같은 이름 값을 덮어쓰고 tier 는 game_tiers 를 대신한다. 사무·학습은 게임용
  # 하한(DDR5·최신 소켓·1TB·Gold·750W)을 걷어 낸다. 외장 GPU 없는 구성(내장 그래픽)은 슬롯 구조상
  # 아직 표현하지 못해 GPU 는 최저 등급으로 남긴다.
  purpose_profiles:
    office:
      tier: {gpu: 3, cpu: 4, ram_gb: 16, vram_gb: 4}
      ram_type: null                     # DDR4/DDR5 모두 허용 — 메인보드와의 일치는 호환 검사가 본다
      storage_capacity_gb_min: 500
      psu_efficiency_min: Bronze
      estimated_power_w: {cpu: 65, gpu: 75, other: 75}
      sockets_by_brand:
        intel: [LGA1700, LGA1851]
        amd: [AM4, AM5]
        none: [LGA1700, LGA1851, AM4, AM5]
      budget_allocation: {GPU: 0.10, CPU: 0.25, 메인보드: 0.15, RAM: 0.12, 저장장치: 0.12, 파워: 0.10, 케이스: 0.09, 쿨러: 0.07}
    study:
      tier: {gpu: 3, cpu: 6, ram_gb: 16, vram_gb: 4}
      ram_type: null
      storage_capacity_gb_min: 500
      psu_efficiency_min: Bronze
      estimated_power_w: {cpu: 65, gpu: 75, other: 75}
      sockets_by_brand:
        intel: [LGA1700, LGA1851]
        amd: [AM4, AM5]
        none: [LGA1700, LGA1851, AM4, AM5]
      budget_allocation: {GPU: 0.10, CPU: 0.25, 메인보드: 0.15, RAM: 0.12, 저장장치: 0.12, 파워: 0.10, 케이스: 0.09, 쿨러: 0.07}
    other:                               # 기타: 용도를 특정하지 못한 범용 — 학습과 같은 수준(2026-09-21 결정)
      tier: {gpu: 3, cpu: 6, ram_gb: 16, vram_gb: 4}
      ram_type: null
      storage_capacity_gb_min: 500
      psu_efficiency_min: Bronze
      estimated_power_w: {cpu: 65, gpu: 75, other: 75}
      sockets_by_brand:
        intel: [LGA1700, LGA1851]
        amd: [AM4, AM5]
        none: [LGA1700, LGA1851, AM4, AM5]
      budget_allocation: {GPU: 0.10, CPU: 0.25, 메인보드: 0.15, RAM: 0.12, 저장장치: 0.12, 파워: 0.10, 케이스: 0.09, 쿨러: 0.07}
    creation:                            # 창작: CPU·RAM 우선, GPU 는 중간 등급
      tier: {gpu: 6, cpu: 8, ram_gb: 32, vram_gb: 8}
      estimated_power_w: {cpu: 150, gpu: 200, other: 75}
      budget_allocation: {GPU: 0.28, CPU: 0.28, 메인보드: 0.10, RAM: 0.10, 저장장치: 0.10, 파워: 0.06, 케이스: 0.04, 쿨러: 0.04}
  sockets_by_brand:
    intel: [LGA1851]
    amd: [AM5]
    none: [LGA1851, AM5]
  estimated_power_w: {cpu: 125, gpu: 300, other: 75}
  psu_headroom_multiplier: 1.5
  psu_standard_wattages: [550, 650, 750, 850, 1000, 1200]
  ram_type: DDR5
  motherboard_form_factors: [ATX, mATX]
  storage_protocol: NVMe
  storage_capacity_gb_min: 1000
  psu_efficiency_min: Gold
  case_form: ATX_mid
  budget_allocation:
    GPU: 0.40
    CPU: 0.18
    메인보드: 0.10
    RAM: 0.08
    저장장치: 0.07
    파워: 0.08
    케이스: 0.05
    쿨러: 0.04

verification:
  efficiency_order: [Standard, Bronze, Silver, Gold, Platinum, Titanium]
  # The strings remain part of RequirementSpec for the existing API/log contract.
  link_rules:
    - cpu.socket == mainboard.socket
    - ram.type == mainboard.mem_type
    - gpu.length_mm <= case.max_gpu_len_mm
    - cooler.height_mm <= case.max_cooler_height_mm
    - cpu.socket in cooler.supported_socket
    - cpu.family in mainboard.supported_cpu_family
    - psu.form_factor fits case.psu_form_factor
    - gpu.power_connector provided by psu.gpu_power_connector (종류와 개수)
    - psu.length_mm <= case.max_psu_length_mm
    - ceil(gpu.slot_thickness) <= case.expansion_slots
    - cooler.radiator_mm in case.radiator_front/top/rear_mm
    - ram.module_count <= mainboard.dimm_slots and ram.capacity_gb <= mainboard.max_memory_gb
    - m2 ssd requires mainboard.m2_slots >= 1
    - sum(power) <= psu.wattage * {psu_capacity_factor}
  socket: {mainboard_spec: socket, cpu_spec: socket}
  # BIOS 축: CPU 이름에서 읽은 세대·계열(compat_parse.cpu_family)이 메인보드의 지원 CPU 계열 표기에 있는가.
  bios: {mainboard_spec: supported_cpu_family}
  # 파워 폼팩터(ATX·SFX·SFX-L)가 케이스가 지원하는 파워 크기에 들어가는가. 더 큰 파워는 확정 비호환, 더 작은 파워는 어댑터가 필요하다.
  psu_form: {psu_spec: form_factor, case_spec: psu_form_factor}
  # GPU 보조 전원 커넥터(8핀·16핀)를 파워가 제공하는가. 16핀 GPU + 8핀 파워는 동봉 어댑터가 필요하다(확정 비호환 아님).
  gpu_connector: {gpu_spec: power_connector, aux_spec: aux_power, psu_spec: gpu_power_connector,
                  psu_pcie_count_spec: pcie_8pin_count, psu_16_count_spec: connector_12v2x6_count}
  # 파워 길이 ≤ 케이스가 허용하는 파워 길이.
  psu_length: {psu_spec: length_mm, case_spec: max_psu_length_mm}
  # GPU 두께(슬롯 수, 올림) ≤ 케이스 확장 슬롯 수.
  gpu_slots: {gpu_spec: slot_thickness, case_spec: expansion_slots}
  # 수랭(AIO) 라디에이터 크기가 케이스의 전면·상단·후면 중 한 곳에는 들어가는가.
  radiator: {cooler_spec: radiator_mm, case_specs: [radiator_front_mm, radiator_top_mm, radiator_rear_mm]}
  # RAM 모듈 수 ≤ 메인보드 DIMM 슬롯 수, RAM 총용량 ≤ 메인보드 최대 메모리 용량.
  ram_slots: {ram_module_spec: module_config, ram_capacity_spec: capacity_gb, board_slots_spec: dimm_slots, board_max_capacity_spec: max_memory_gb}
  # RAM 속도가 메인보드가 명시한 최대 속도를 넘으면 낮은 속도로 동작한다(비호환은 아니라 확인 필요로만 표시).
  ram_speed: {ram_spec: speed_mts, board_spec: max_memory_speed_mts}
  # M.2 SSD 는 메인보드에 M.2 슬롯이 있어야 하고, SSD 의 PCIe 세대가 슬롯보다 높으면 낮은 속도로 동작한다.
  m2: {ssd_form_spec: form_factor, ssd_interface_spec: interface, board_slots_spec: m2_slots, board_gen_spec: m2_pcie_gen}
  memory: {mainboard_spec: mem_type, ram_spec: mem_type}
  motherboard_case: {mainboard_spec: form_factor, case_spec: supports_form_factors}
  gpu_length: {gpu_spec: length_mm, case_spec: max_gpu_len_mm}
  cooler_height: {cooler_spec: height_mm, case_spec: max_cooler_height_mm}
  cooler_socket: {cooler_spec: supported_socket, cpu_spec: socket}
  power:
    cpu_spec: tdp_w
    # 최대 패키지 전력(Intel MTP/PL2, AMD PPT). 있으면 TDP 대신 쓴다(K 모델 등은 TDP 의 두 배 가까이 쓴다).
    cpu_peak_spec: max_power_w
    gpu_spec: power_w
    psu_spec: wattage_w
    psu_capacity_factor: 0.9
    # 업그레이드에서 GPU 와 파워 중 한쪽만 견적에 들어갈 때, GPU 스펙의 제조사 권장 파워를 유지 파워 용량과 비교한다.
    use_gpu_recommended_psu: true
  balance_max_tier_gap: 3

ranking:
  impact_slots: [GPU, CPU]
  ideal_tiers:
    game:
      FHD_144: {GPU: 6.0, CPU: 6.0}
      QHD_165: {GPU: 7.5, CPU: 5.5}
      4K: {GPU: 9.0, CPU: 5.5}
    # 해상도가 없는 용도는 default 를 쓴다(purpose_profiles 의 tier 와 같은 눈금).
    office: {default: {GPU: 3.0, CPU: 4.0}}
    study: {default: {GPU: 3.0, CPU: 6.0}}
    creation: {default: {GPU: 6.0, CPU: 8.0}}
    other: {default: {GPU: 3.0, CPU: 6.0}}
  # 소음 축은 기본 가중치 0 — priority/noise_sensitive 를 안 준 요청의 점수는 이전과 같다.
  weights: {가격: 0.35, 성능: 0.25, 밸런스: 0.15, 리뷰: 0.20, 호환여유: 0.05, 소음: 0.0}
  # 우선순위(priority)별 가중치 세트. 합계 1. 표에 없는 값/미지정은 위 weights 를 쓴다.
  priority_weights:
    performance: {가격: 0.10, 성능: 0.55, 밸런스: 0.10, 리뷰: 0.20, 호환여유: 0.05, 소음: 0.0}
    value: {가격: 0.50, 성능: 0.15, 밸런스: 0.10, 리뷰: 0.20, 호환여유: 0.05, 소음: 0.0}
    quiet: {가격: 0.25, 성능: 0.15, 밸런스: 0.10, 리뷰: 0.20, 호환여유: 0.05, 소음: 0.25}
  # 검사에 필요한 스펙이 비어 있는 후보는 점수를 조금 깎는다. "정보 없음"은 비호환이 아니라 통과로 취급하는데(엔진 원칙),
  # 그러면 데이터가 빈 싼 부품이 검사를 피해 계속 뽑힌다(케이스가 늘 가장 싼 한 종으로 고정됐던 원인). 값이 하나라도 채워진
  # 슬롯에서만 적용해서, 아직 아무 값도 없는 카탈로그(합성·시드 전)의 점수는 바뀌지 않는다. 채워지는 만큼 자동으로 사라진다.
  data_gap:
    penalty_per_key: 0.10      # 비어 있는 스펙 1개당 감점
    max_penalty: 0.20          # 한 후보의 감점 상한
    specs:
      케이스: [max_psu_length_mm, expansion_slots, max_gpu_len_mm, max_cooler_height_mm]
      파워: [length_mm, pcie_8pin_count]
      메인보드: [dimm_slots, max_memory_gb, m2_slots]
      GPU: [length_mm, slot_thickness]
  # noise_sensitive=true 이면 소음 가중치를 최소 이만큼 보장한다(나머지 축은 비율대로 줄인다).
  noise_sensitive_min_weight: 0.15
  # 소음은 직접 측정값(dBA)도 리뷰 관점 정보도 없어 물리적 대용값으로 잡는다 — 휴리스틱이다.
  # CPU/GPU 는 소비전력(발열이 적을수록 팬이 덜 돈다)을 [낮음, 높음] 범위에서 1→0 으로,
  # 쿨러는 유형(큰 방열판·라디에이터는 낮은 회전수로 버틴다)으로 본다. 파워는 효율 등급과
  # 소음의 연결 근거가 약해 넣지 않았다(넣었더니 저소음 요청이 1300W Titanium 을 골라 견적이
  # 64만원 뛰었다). 표에 없는 값(Passive 쿨러 등)과 다른 슬롯은 중립 0.5 — 지어내지 않는다.
  noise_proxy:
    cpu_tdp_w: [65, 200]
    gpu_power_w: [75, 450]
    cooler_type: {"Air (Dual-Tower)": 0.8, "Air (Single-Tower)": 0.6, "Liquid (AIO)": 0.6, "Air (Low-Profile)": 0.2}
