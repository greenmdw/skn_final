<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>목적성 쇼핑 파이프라인 — GUI 목업</title>
<style>
  :root {
    --bg:#0f1117; --panel:#1a1d27; --panel2:#232734; --line:#2f3444;
    --text:#e6e8ee; --dim:#99a0b3; --accent:#6ea8fe;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body { background:var(--bg); }
  body { margin:0; color:var(--text);
    font:13px/1.6 system-ui,"Segoe UI","Malgun Gothic",sans-serif; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; }
  header p { margin:4px 0 0; color:var(--dim); font-size:11px; }
  main { max-width:900px; margin:0 auto; padding:18px 22px; }
  .mockline { color:var(--dim); font-size:11px; margin:0 0 14px; }
  .fakeinput { display:flex; gap:8px; margin-bottom:6px; }
  .fakeinput .box { flex:1; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:9px 12px; color:var(--text); }
  .fakeinput .btn { background:var(--accent); color:#0b1020; border-radius:8px;
    padding:9px 20px; font-weight:700; }
  .panel { background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; margin-top:16px; break-inside:avoid; }
  .panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--dim); }
  pre.log { margin:0; background:#0b0d13; border:1px solid var(--line);
    border-radius:8px; padding:12px;
    font:11px/1.5 "Cascadia Mono",Consolas,monospace; color:#c6cbd9; white-space:pre-wrap; }
  .kv { display:grid; grid-template-columns:88px 1fr; gap:4px 12px; }
  .kv dt { color:var(--dim); }
  .kv dd { margin:0; }
  .tag { display:inline-block; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:1px 9px; margin:2px 4px 2px 0; font-size:11px; }
  .item { border:1px solid var(--line); border-radius:10px; padding:13px;
    margin-top:12px; background:var(--panel2); break-inside:avoid; }
  .item > h3 { margin:0 0 8px; font-size:14px; }
  .cands { list-style:none; margin:0 0 10px; padding:0; }
  .cands li { display:flex; justify-content:space-between; padding:3px 0;
    border-bottom:1px dashed var(--line); font-size:12px; }
  .cands li:last-child { border-bottom:0; }
  .attempts { display:flex; flex-direction:column; gap:6px; margin:8px 0 10px; }
  .attempt { display:flex; align-items:center; gap:8px; font-size:12px;
    padding:6px 10px; border-radius:8px; background:#0b0d13; border:1px solid var(--line); }
  .badge { font-size:10px; font-weight:700; padding:1px 8px; border-radius:999px; }
  .badge.ok { background:rgba(63,185,80,.15); color:var(--ok); border:1px solid var(--ok); }
  .badge.bad { background:rgba(248,81,73,.15); color:var(--bad); border:1px solid var(--bad); }
  .retry-note { color:var(--warn); font-size:11px; margin:2px 0 10px; }
  .chosen { border-left:3px solid var(--ok); padding-left:12px; margin:10px 0; }
  .chosen a { color:var(--accent); }
  .contrib { max-width:440px; margin-top:10px; }
  .contrib .ctitle { color:var(--dim); font-size:11px; margin-bottom:6px; }
  .crow { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12px; }
  .crow .clabel { width:36px; color:var(--dim); }
  .crow .cbar { flex:1; height:12px; background:#0b0d13; border:1px solid var(--line);
    border-radius:6px; overflow:hidden; }
  .crow .cbar i { display:block; height:100%; background:var(--accent); }
  .crow .cval { width:44px; text-align:right; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  tfoot td { font-weight:700; }
  .neg { color:var(--ok); }
  .muted { color:var(--dim); font-size:11px; }
  @page { size:A4; margin:11mm; }
</style>
</head>
<body>
<header>
  <h1>목적성 쇼핑 파이프라인 — 임시 GUI 목업</h1>
  <p>의도분해 → 비교매칭 → 검증(+재탐색) → 설명생성 → 리포트 · 전부 MOCK 데이터</p>
</header>
<main>
  <p class="mockline">아래는 백엔드 <code>/run</code> 응답으로 렌더된 화면 스냅샷입니다 (실제 API 미호출, 고정 mock).</p>
  <div class="fakeinput">
    <div class="box">가을에 4인 가족이랑 캠핑 가려고 하는데 장비 좀 챙겨줘. 예산은 40만원 정도.</div>
    <div class="btn">실행</div>
  </div>

  <section class="panel"><h2>단계 로그</h2><pre class="log" id="log"></pre></section>
  <section class="panel"><h2>[1/5] 의도 분해 · 슬롯</h2><div id="slot"></div></section>
  <section class="panel"><h2>[2~4/5] 품목별 매칭 · 검증 · 설명</h2><div id="items"></div></section>
  <section class="panel"><h2>[5/5] 리포트</h2><div id="report"></div></section>
</main>

    if (it["\ucc44\ud0dd"]) {
      const c=it["\ucc44\ud0dd"];
      chosenHtml=`<div class="chosen"><div><b>\ucc44\ud0dd:</b> ${esc(c["\uc0c1\ud488\uba85"])}</div><div class="muted">${won(c["\uac00\uaca9"])} \u00b7 ${esc(c["\uc5c5\uccb4"])} \u00b7 \uc2e0\ub8b0\ub3c4 ${c["\uc2e0\ub8b0\ub3c4"]}\uc810 \u00b7 <a href="${esc(c["\ub9c1\ud06c"])}">\uc0c1\ud488 \ub9c1\ud06c</a></div><div style="margin-top:6px">${esc(it["\uc885\ud569_\uc694\uc57d"])}</div></div>`;
      const k=it["\uae30\uc5ec\ub3c4"]||{};
      const bars=Object.keys(k).map(l=>`<div class="crow"><span class="clabel">${esc(l)}</span><span class="cbar"><i style="width:${k[l]}%"></i></span><span class="cval">${k[l]}%</span></div>`).join("");
      contribHtml=`<div class="contrib"><div class="ctitle">\uc18d\uc131 \uae30\uc5ec\ub3c4 (\ubbfc\uac10\ub3c4 \ubd84\uc11d, %)</div>${bars}</div>`;
    } else {
      chosenHtml=`<div class="retry-note">\ubaa8\ub4e0 \ud6c4\ubcf4 \uc2e0\ub8b0\ub3c4 \ubbf8\ub2ec \u2192 \ub9ac\ud3ec\ud2b8\uc5d0\uc11c \uc81c\uc678</div>`;
    }
    el.innerHTML = `<h3>\ud488\ubaa9 ${idx+1}. ${esc(it["\ud488\ubaa9"])}</h3>
      <div class="muted" style="margin-bottom:4px">\ube44\uad50\ub9e4\uce6d \ud6c4\ubcf4 (\uc0c1\uc704 ${(it["\ud6c4\ubcf4\ub4e4"]||[]).length}\uac1c)</div>
      <ul class="cands">${cands}</ul>
      <div class="muted" style="margin-bottom:4px">\uac80\uc99d \u00b7 \uc7ac\ud0d0\uc0c9 \ub8e8\ud504</div>
      <div class="attempts">${attempts}</div>${retry}${chosenHtml}${contribHtml}`;
    box.appendChild(el);
  });

  const r = d["\ub9ac\ud3ec\ud2b8"] || {};
  const rows = (r.items||[]).map(x=>`<tr><td>${esc(x["\ud488\ubaa9"])}</td><td>${esc(x["\uc5c5\uccb4"])}</td><td>${won(x["\uac00\uaca9"])}</td><td>${x["\uc2e0\ub8b0\ub3c4"]}\uc810</td><td class="${x["\uc808\uac10\uc561"]<0?"neg":""}">${won(x["\uc808\uac10\uc561"])}</td></tr>`).join("");
  $("report").innerHTML = `<table>
    <thead><tr><th>\ud488\ubaa9</th><th>\uc5c5\uccb4</th><th>\uac00\uaca9</th><th>\uc2e0\ub8b0\ub3c4</th><th>\uc808\uac10\uc561</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="2">\ucd1d\uc561</td><td>${won(r["\ucd1d\uc561"])}</td><td colspan="2"></td></tr>
    <tr><td colspan="2">\ud3c9\uade0 \uc2e0\ub8b0\ub3c4</td><td colspan="3" style="text-align:left">${r["\ud3c9\uade0_\uc2e0\ub8b0\ub3c4"]}\uc810</td></tr></tfoot>
  </table>`;
}
render(DATA);
</script>
</body>
</html>
