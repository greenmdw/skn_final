<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>목적성 쇼핑 파이프라인 — 임시 GUI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --panel2: #232734; --line: #2f3444;
    --text: #e6e8ee; --dim: #99a0b3; --accent: #6ea8fe;
    --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 12px; }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  .row { display: flex; gap: 8px; }
  textarea { flex: 1; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: inherit; resize: vertical; min-height: 52px; }
  button { background: var(--accent); color: #0b1020; border: 0; border-radius: 8px;
    padding: 0 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-top: 18px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--dim); }
  pre.log { margin: 0; background: #0b0d13; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; max-height: 260px; overflow: auto;
    font: 12px/1.55 "Cascadia Mono", Consolas, monospace; color: #c6cbd9; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; }
  .tag { display: inline-block; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 9px; margin: 2px 4px 2px 0; font-size: 12px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    margin-top: 12px; background: var(--panel2); }
  .item > h3 { margin: 0 0 8px; font-size: 15px; }
  .cands { list-style: none; margin: 0 0 10px; padding: 0; }
  .cands li { display: flex; justify-content: space-between; padding: 3px 0;
    border-bottom: 1px dashed var(--line); font-size: 13px; }
  .cands li:last-child { border-bottom: 0; }
  .attempts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
  .attempt { display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; background: #0b0d13; border: 1px solid var(--line); }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.bad { background: rgba(248,81,73,.15); color: var(--bad); border: 1px solid var(--bad); }
  .retry-note { color: var(--warn); font-size: 12px; margin: 2px 0 10px; }
  .chosen { border-left: 3px solid var(--ok); padding-left: 12px; margin: 10px 0; }
  .chosen a { color: var(--accent); }
  .chart-wrap { max-width: 460px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tfoot td { font-weight: 700; }
  .neg { color: var(--ok); }
  .muted { color: var(--dim); font-size: 12px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>목적성 쇼핑 파이프라인 — 임시 GUI</h1>
  <p>의도분해 → 비교매칭 → 검증(+재탐색) → 설명생성 → 리포트 &nbsp;·&nbsp; 전부 MOCK 데이터 (백엔드 <code>/run</code> 호출)</p>
</header>
<main>
  <div class="row">
    <textarea id="q">가을에 4인 가족이랑 캠핑 가려고 하는데 장비 좀 챙겨줘. 예산은 40만원 정도.</textarea>
    <button id="go">실행</button>
  </div>
  <p class="muted" id="status"></p>

  <section class="panel" id="logPanel" hidden>
    <h2>단계 로그</h2>
    <pre class="log" id="log"></pre>
  </section>

  <section class="panel" id="slotPanel" hidden>
    <h2>[1/5] 의도 분해 · 슬롯</h2>
    <div id="slot"></div>
  </section>

  <section class="panel" id="itemsPanel" hidden>
    <h2>[2~4/5] 품목별 매칭 · 검증 · 설명</h2>
    <div id="items"></div>
  </section>

  <section class="panel" id="reportPanel" hidden>
    <h2>[5/5] 리포트</h2>
    <div id="report"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const won = (n) => (n ?? 0).toLocaleString("ko-KR") + "원";
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let charts = [];

$("go").addEventListener("click", run);

async function run() {
  const message = $("q").value.trim();
  if (!message) return;
  $("go").disabled = true;
  $("status").textContent = "파이프라인 실행 중...";
  charts.forEach(c => c.destroy());
  charts = [];
  try {
    const res = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
    $("status").textContent = "완료.";
  } catch (e) {
    $("status").innerHTML = '<span class="err">에러: ' + esc(e.message) + " — 백엔드(uvicorn src.api:app)가 떠 있는지 확인하세요.</span>";
  } finally {
    $("go").disabled = false;
  }
}

function render(d) {
  // 단계 로그
  $("log").textContent = (d.logs || []).join("\n");
  $("logPanel").hidden = false;

  // 슬롯
  const s = d["슬롯"] || {};
  let slotHtml = `<dl class="kv">
    <dt>목적</dt><dd>${esc(s["목적"])}</dd>
    <dt>인원수</dt><dd>${esc(s["인원수"] ?? "-")}</dd>
    <dt>예산</dt><dd>${s["예산"] ? won(s["예산"]) : "-"}</dd>
    <dt>이미 보유</dt><dd>${(s["이미_보유한_품목"] || []).map(x => `<span class="tag">${esc(x)}</span>`).join("") || "-"}</dd>
    <dt>체크리스트</dt><dd>${(s["체크리스트"] || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</dd>
  </dl>`;
  if (d["후속질문"]) {
    slotHtml = `<p class="retry-note">슬롯 부족 → 후속 질문: "${esc(d["후속질문"])}" &nbsp;(데모 답변: "${esc(d["시뮬레이션_답변"])}")</p>` + slotHtml;
  }
  $("slot").innerHTML = slotHtml;
  $("slotPanel").hidden = false;

  // 품목별
  const box = $("items");
  box.innerHTML = "";
  (d["품목결과"] || []).forEach((it, idx) => {
    const el = document.createElement("div");
    el.className = "item";

    const cands = (it["후보들"] || []).map(c =>
      `<li><span>${c["순위"]}. ${esc(c["상품명"])}</span><span>${won(c["가격"])} · ${esc(c["업체"])}</span></li>`
    ).join("");

    const attempts = (it["검증_시도"] || []).map(a => {
      const ok = a["통과"];
      return `<div class="attempt">
        <span class="badge ${ok ? "ok" : "bad"}">${ok ? "통과" : "실패"}</span>
        <span>후보 ${a["순번"]} · 신뢰도 <b>${a["신뢰도"]}</b>점</span>
        <span class="muted">${esc(a["상품명"])}</span>
      </div>`;
    }).join("");

    const retry = it["재탐색_횟수"] > 0
      ? `<p class="retry-note">↻ 재탐색 ${it["재탐색_횟수"]}회 발생 — 첫 후보가 신뢰도 기준 미달로 탈락, 다음 후보로 재시도</p>`
      : "";

    let chosenHtml, chartHtml = "";
    if (it["채택"]) {
      const c = it["채택"];
      chosenHtml = `<div class="chosen">
        <div><b>채택:</b> ${esc(c["상품명"])}</div>
        <div class="muted">${won(c["가격"])} · ${esc(c["업체"])} · 신뢰도 ${c["신뢰도"]}점 · <a href="${esc(c["링크"])}" target="_blank" rel="noopener">상품 링크</a></div>
        <div style="margin-top:6px">${esc(it["종합_요약"])}</div>
      </div>`;
      chartHtml = `<div class="chart-wrap"><canvas id="chart-${idx}" height="150"></canvas></div>`;
    } else {
      chosenHtml = `<div class="retry-note">모든 후보 신뢰도 미달 → 리포트에서 제외</div>`;
    }

    el.innerHTML = `<h3>품목 ${idx + 1}. ${esc(it["품목"])}</h3>
      <div class="muted" style="margin-bottom:4px">비교매칭 후보 (상위 ${(it["후보들"] || []).length}개)</div>
      <ul class="cands">${cands}</ul>
      <div class="muted" style="margin-bottom:4px">검증 · 재탐색 루프</div>
      <div class="attempts">${attempts}</div>
      ${retry}
      ${chosenHtml}
      ${chartHtml}`;
    box.appendChild(el);

    if (it["채택"] && it["기여도"]) {
      const k = it["기여도"];
      const labels = Object.keys(k);
      const ctx = document.getElementById(`chart-${idx}`);
      charts.push(new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "속성 기여도 (%)",
            data: labels.map(l => k[l]),
            backgroundColor: "#6ea8fe",
          }],
        },
        options: {
          indexAxis: "y",
          plugins: { legend: { display: false }, title: { display: true, text: "속성 기여도 (%)", color: "#99a0b3" } },
          scales: {
            x: { ticks: { color: "#99a0b3" }, grid: { color: "#2f3444" } },
            y: { ticks: { color: "#e6e8ee" }, grid: { display: false } },
          },
        },
      }));
    }
  });
  $("itemsPanel").hidden = false;

  // 리포트
  const r = d["리포트"] || {};
  const rows = (r.items || []).map(x =>
    `<tr><td>${esc(x["품목"])}</td><td>${esc(x["업체"])}</td><td>${won(x["가격"])}</td>
     <td>${x["신뢰도"]}점</td><td class="${x["절감액"] < 0 ? "neg" : ""}">${won(x["절감액"])}</td></tr>`
  ).join("");
  $("report").innerHTML = `<table>
    <thead><tr><th>품목</th><th>업체</th><th>가격</th><th>신뢰도</th><th>절감액</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot>
      <tr><td colspan="2">총액</td><td>${won(r["총액"])}</td><td colspan="2"></td></tr>
      <tr><td colspan="2">평균 신뢰도</td><td colspan="3" style="text-align:left">${r["평균_신뢰도"]}점</td></tr>
    </tfoot>
  </table>`;
  $("reportPanel").hidden = false;
}
</script>
</body>
</html>
