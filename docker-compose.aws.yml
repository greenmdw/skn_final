# AWS 서버(EC2 + RDS)용 — DB 컨테이너 없이 api 만 띄운다. DB 는 RDS(.env 의 DATABASE_URL)를 쓴다.
#   cp deploy/aws.env.example .env   # 값 채우기 (git 에 올리지 않는다)
#   scripts/deploy_aws.sh            # pull → 빌드 → 마이그레이션 → 기동 → 헬스체크
# 최초 1회만: docker compose -f docker-compose.aws.yml run --rm api python db/setup_all.py   (스키마 + 시드)
services:
  api:
    build: .
    image: truefit-api:aws
    env_file: .env
    # 프로세스 수는 vCPU 수에 맞춘다(t3.medium = 2). 요청 한도·LLM 상한·추천 작업자는 프로세스마다 따로 센다.
    command: ["sh", "-c", "exec uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-2}"]
    ports:
      - "80:8000"
    volumes:
      # 비공개 시드 데이터(data/peripherals, data/review_seed 등 git 에 없는 파일)는 서버의 ./data 에 올려 두고 마운트한다 — 올릴 때 다시 빌드하지 않아도 된다.
      - ./data:/app/data:ro
      # 커뮤니티 첨부 이미지 — 서버의 ./uploads 에 저장돼 재배포해도 남는다(쓰기 가능해야 하므로 data 와 따로 둔다).
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 주변기기 사용기 분석 작업(개발요청 O-1) — 커뮤니티 글의 변경을 읽어 체감 문장을 뽑고 근거를 DB(engine.peripheral_post_*)에 쌓는다.
  # api 와 같은 이미지·같은 .env 를 쓰고 따로 도는 프로세스다. 포트·볼륨은 필요 없다(상태는 DB 에 저장된다).
  # PERIPHERAL_POST_AGENT=1(+ MOCK_MODE=0, OPENAI_API_KEY)일 때만 분석한다. 꺼져 있으면 컨테이너는 안내만 남기고 대기한다 —
  # 작업 프로그램이 종료 코드 2 로 끝나면 restart 정책이 계속 다시 띄우기 때문이다. 켜고 끄는 법은 deploy/README.md.
  worker:
    image: truefit-api:aws
    env_file: .env
    depends_on:
      - api
    command:
      - sh
      - -c
      - |
        if [ "$${PERIPHERAL_POST_AGENT:-0}" = "1" ]; then
          exec python -u -m src.workers.peripheral_post_analysis
        fi
        echo "사용기 분석 작업이 꺼져 있습니다(PERIPHERAL_POST_AGENT=1 로 켠 뒤 docker compose up -d worker). 대기합니다."
        exec sleep infinity
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 삭제 표시한 대화·견적서를 보관 기간(PURGE_DELETED_AFTER_DAYS, 기본 30일)이 지나면 영구 삭제한다(재기획 6.7).
  # 켜기: .env 에 PURGE_DELETED=1 → docker compose up -d purge. 꺼져 있으면 아무것도 지우지 않고 대기한다.
  purge:
    image: truefit-api:aws
    env_file: .env
    depends_on:
      - api
    command:
      - sh
      - -c
      - |
        if [ "$${PURGE_DELETED:-0}" = "1" ]; then
          exec python -u -m src.workers.purge_deleted
        fi
        echo "영구 삭제 작업이 꺼져 있습니다(PURGE_DELETED=1 로 켠 뒤 docker compose up -d purge). 대기합니다."
        exec sleep infinity
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
