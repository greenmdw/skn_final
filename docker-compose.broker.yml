# EC2 #4 (Broker) 전용 — Odoo·Postgres 없음. t2.micro 로 충분.
#   broker : 중앙 브로커 서비스, 포트 9000
#
# .env 에 SELLER_ENDPOINTS 를 넣거나 (요청마다 buyer 가 넘기면 생략 가능):
#   SELLER_ENDPOINTS=http://10.0.1.11:8000,http://10.0.1.12:8000

services:
  broker:
    build: .
    command: uvicorn app.broker_service:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    environment:
      NEGOTIATOR_MODE: ${NEGOTIATOR_MODE:-rule}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BROKER_MAX_ROUNDS: ${BROKER_MAX_ROUNDS:-3}
      SELLER_ENDPOINTS: ${SELLER_ENDPOINTS:-}
    volumes:
      - broker-data:/app/data

volumes:
  broker-data:
