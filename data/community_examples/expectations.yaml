# 예시 글 정답표 — 분석 결과가 이 표와 맞는지 `scripts/check_example_expectations.py` 가 비교한다.
#
# 출처: docs/local/예시_사용기_작성_기획.md 5장 표의 "좋게 쓸 것 / 아쉽게 쓸 것 / 성향" 열을 속성 코드로 옮긴 것이다.
# 글쓴이가 그렇게 쓰도록 기획한 값이지 실제 정답이 아니다. 불일치는 추출 오류일 수도, 글이 기획과 다르게 쓰였을 수도 있다.
#
# 쓰는 법
#   must      그 글에서 이 제품에 대해 반드시 나와야 하는 근거: 속성 코드 → 값(또는 값 목록).
#             평가 속성(grip, click, wheel, side_button, wireless, battery, wrist, adaptation, software, durability, build, looks)의
#             값은 good / bad / mixed, 성향 속성의 값은 쪽 코드다
#             (weight_feel: light|heavy, size_feel: small|big, click_sound: quiet|loud, glide: fast|brake).
#   must_not  나오면 안 되는 근거(같은 형식). 필요한 글에만 적는다.
#   ""애매한 것""(예: 정밀 드래그가 느리다)은 속성 코드에 1:1로 대응하지 않아 적지 않았다 — 사람이 읽고 판단한다.
#
# 글 번호가 `-4` 로 끝나는 글은 작성자 조건(손 크기·목적·상황)을 밝히지 않는 글이라 별도 규칙(hidden_conditions)으로 점검한다.

version: 1
reference_date: 2026-10-12          # 기획표의 기준일("최근 3개월 사용기 수")

# 근거가 0건이어야 하는 글(사용기가 아닌 글)
no_evidence: [F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F13, F14, F15, F16]

# 사용 기간을 6개월 이상 밝힌 글만 내구성 근거를 낼 수 있다(config/peripherals.yaml feel.durability_min_months).
durability_allowed: [A2-1, A9-4]

